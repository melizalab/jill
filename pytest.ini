[pytest]
testpaths = test

# the driver imports helpers from conftest by name, so test/ has to be on the
# path; this is the default for rootdir-relative test packages but is stated
# explicitly since the suites are not a package
pythonpath = test

markers =
    needs_jack: requires a running JACK server (started on the dummy backend)
    needs_arf: requires the ARF/HDF5 build, so absent under --no-arf
    manual: cannot run unattended; start it by hand
